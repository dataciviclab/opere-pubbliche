[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "opere-pubbliche-intelligence"
version = "0.2.0"
description = "Dove vanno i soldi delle opere pubbliche in Italia — 11,8 milioni di CUP interrogabili"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

# duckdb: dipendenza runtime (usata dai test SQL e dagli script analitici).
# toolkit non è importato (CLI esterno) → vive nell'extra `pipeline`.
dependencies = [
    "duckdb>=1.5.3,<2",
]

# Nessun package Python: il repo è dati + SQL + scripts.
[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
    "openpyxl>=3.1",
    "pytest>=8.0",
]

[project.urls]
Home = "https://github.com/dataciviclab/opere-pubbliche-intelligence"
Repository = "https://github.com/dataciviclab/opere-pubbliche-intelligence"
Issues = "https://github.com/dataciviclab/opere-pubbliche-intelligence/issues"
Discussions = "https://github.com/dataciviclab/opere-pubbliche-intelligence/discussions"

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, path contract, output CI",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "smoke: test che fa chiamate reali (richiede connettivita')",
]

[tool.toolkit.extends]
source_id = "opere_pubbliche_intelligence"
